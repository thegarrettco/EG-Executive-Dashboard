name: Procore 3rd Party Summary

on:
  schedule:
    - cron: '0 11 * * *'   # 6am ET daily (11:00 UTC)
  workflow_dispatch:
    inputs:
      smoke_test:
        description: 'Smoke test only (10 rows, no POST)'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "delta-sharing>=1.1" requests pandas

      - name: Sync Procore to Worker
        env:
          PROCORE_DS_ENDPOINT: ${{ secrets.PROCORE_DS_ENDPOINT }}
          PROCORE_DS_TOKEN:    ${{ secrets.PROCORE_DS_TOKEN }}
          PROCORE_DS_SHARE:    ${{ secrets.PROCORE_DS_SHARE }}
          WORKER_URL:          ${{ secrets.WORKER_URL }}
          SMOKE_TEST:          ${{ inputs.smoke_test }}
        run: python scripts/procore_third_party.py
