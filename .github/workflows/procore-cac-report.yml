name: Procore CAC Variance Report

on:
  workflow_dispatch:
    inputs:
      project_ids:
        description: 'Optional: comma-separated Procore project IDs (blank = all projects)'
        required: false
        default: ''
      view_id:
        description: 'Budget view ID from the budget page link'
        required: true
        default: '736678'
      raw_data_project_ids:
        description: 'Optional: project IDs to add a raw-data block for (Everrange = 3294938)'
        required: false
        default: ''
      baseline_snapshot_id:
        description: 'Optional: force a specific snapshot ID as the baseline'
        required: false
        default: ''

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "delta-sharing>=1.1" pandas openpyxl

      - name: Build CAC variance workbook
        env:
          PROCORE_DS_ENDPOINT:  ${{ secrets.PROCORE_DS_ENDPOINT }}
          PROCORE_DS_TOKEN:     ${{ secrets.PROCORE_DS_TOKEN }}
          PROCORE_DS_SHARE:     ${{ secrets.PROCORE_DS_SHARE }}
          PROJECT_IDS:          ${{ inputs.project_ids }}
          VIEW_ID:              ${{ inputs.view_id }}
          BASELINE_SNAPSHOT_ID: ${{ inputs.baseline_snapshot_id }}
          RAW_PROJECT_IDS:      ${{ inputs.raw_data_project_ids }}
        run: python scripts/procore_cac_report.py

      - name: Attach workbook to this run
        uses: actions/upload-artifact@v4
        with:
          name: cac-variance-report
          path: report/*.xlsx
          retention-days: 1
          if-no-files-found: error
